<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Print It Now</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@500;700&family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <p class="eyebrow">Print It Now</p>
          <h1>ประเมินราคางานพิมพ์ 3 มิติ</h1>
          <p class="subcopy">อัปโหลด STL หรือ OBJ แล้วดูขนาด น้ำหนัก เวลา และราคาทันที</p>
        </div>
      </header>

      <main class="workspace">
        <section class="panel viewer-panel">
          <div class="viewer-head">
            <div>
              <p class="viewer-label">Preview</p>
              <strong id="file-name">ยังไม่ได้เลือกไฟล์</strong>
            </div>
            <span class="viewer-status" id="preview-status">พร้อมอัปโหลด</span>
          </div>

          <div class="viewer-stage">
            <canvas id="viewer-canvas"></canvas>
          </div>
        </section>

        <aside class="panel control-panel">
          <div class="control-stack">
            <section class="control-group">
              <label class="dropzone" id="dropzone" for="model-file">
                <span class="dropzone-title">เลือกไฟล์ STL หรือ OBJ</span>
                <span class="dropzone-meta" id="dropzone-meta">คลิกหรือวางไฟล์ที่นี่</span>
              </label>
              <input id="model-file" type="file" accept=".stl,.obj,model/stl,text/plain">
            </section>

            <section class="control-group">
              <div class="group-head">
                <span class="group-label">วัสดุ</span>
              </div>
              <div class="material-row" id="material-options">
                <button class="pill-button is-active" type="button" data-material="pla">PLA</button>
                <button class="pill-button" type="button" data-material="petg">PETG</button>
              </div>
            </section>

            <section class="control-group">
              <div class="group-head">
                <span class="group-label">สี</span>
                <span class="group-value" id="material-preview">PLA / White</span>
              </div>
              <div class="color-row" id="color-options">
                <button class="color-button is-active" type="button" data-color-name="White" data-color="#f4f7fb" style="background:#f4f7fb"></button>
                <button class="color-button" type="button" data-color-name="Black" data-color="#11151a" style="background:#11151a"></button>
                <button class="color-button" type="button" data-color-name="Red" data-color="#cf3a43" style="background:#cf3a43"></button>
                <button class="color-button" type="button" data-color-name="Blue" data-color="#3d74e7" style="background:#3d74e7"></button>
              </div>
            </section>

            <section class="control-group">
              <div class="group-head">
                <span class="group-label">Infill</span>
                <span class="group-value" id="infill-value">20%</span>
              </div>
              <input id="infill-input" type="range" min="10" max="40" step="5" value="20">
            </section>

            <button class="action-button" id="calculate-button" type="button">
              ประเมินราคา
            </button>

            <section class="result-panel">
              <div class="price-row">
                <span class="group-label">ราคาประเมิน</span>
                <strong class="summary-price" id="summary-price">THB -</strong>
              </div>
              <p class="summary-subtext" id="summary-message">อัปโหลดไฟล์ก่อน แล้วระบบจะประเมินให้อัตโนมัติ</p>

              <div class="metric-grid">
                <article class="metric-tile">
                  <p class="metric-label">ขนาด</p>
                  <p class="metric-value" id="metric-size">-</p>
                </article>
                <article class="metric-tile">
                  <p class="metric-label">ปริมาตร</p>
                  <p class="metric-value" id="metric-volume">-</p>
                </article>
                <article class="metric-tile">
                  <p class="metric-label">น้ำหนัก</p>
                  <p class="metric-value" id="metric-weight">-</p>
                </article>
                <article class="metric-tile">
                  <p class="metric-label">เวลา</p>
                  <p class="metric-value" id="metric-time">-</p>
                </article>
              </div>

              <div class="warning-box" id="warning-box" hidden></div>
            </section>
          </div>
        </aside>
      </main>
    </div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
